name: health

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'   # 每小时第 7 分钟（UTC）
  # 不用 push 触发：否则每次推代码都会并发跑一次，两个 run 同时改快照会 rebase 冲突。

permissions:
  contents: write

concurrency:
  group: health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: node --test

      - name: Probe free endpoints
        run: node polling.mjs --once --max-probes 24

      - name: Summary
        run: |
          node -e "
          const s=require('./free_pool_snapshot.json');
          console.log('checkedAt', s.checkedAt);
          console.log(JSON.stringify(s.summary));
          for(const [id,m] of Object.entries(s.models)) if(m.status==='alive') console.log(' -', id);
          " >> $GITHUB_STEP_SUMMARY

      - name: Commit snapshot
        run: |
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # GitHub 侧 HTTP/2 偶发 "Error in the HTTP2 framing layer"，强制 HTTP/1.1 规避
          git config --local http.version HTTP/1.1
          git add free_pool_snapshot.json
          if git diff --cached --quiet; then
            echo "snapshot unchanged"
          else
            git commit -m "chore(health): $(date -u '+%Y-%m-%d %H:%M') UTC snapshot"
            ok=0
            for i in 1 2 3 4 5; do
              # 快照是机器产物，并发时后来者赢；-X theirs 直接采用远端内容，不用人工解冲突
              if git pull --rebase -X theirs origin main && git push; then
                ok=1
                break
              fi
              echo "push attempt $i failed, retrying in $((i*5))s"
              git rebase --abort 2>/dev/null || true
              sleep $((i*5))
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::snapshot push failed after 5 attempts"
              exit 1
            fi
          fi

      - name: Purge jsDelivr cache
        if: always()
        continue-on-error: true
        run: curl -sf --max-time 20 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/free_pool_snapshot.json" || true
